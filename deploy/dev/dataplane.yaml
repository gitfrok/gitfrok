---
# T-0021: the data plane (ADR-0025 one modular-monolith binary per plane).
#
# It loads the OPA policy bundle the cluster publishes as a ConfigMap (ADR-0006,
# invariant 2) and exits non-zero without one — AC4. Its healthz endpoint on
# GITFROK_LISTEN_ADDR is the readiness/liveness probe target.
#
# The Git protocol front doors (T-0011) call GITFROK_GIT_STORAGE_ADDR. That
# storage tier is now deployed (deploy/dev/git-storaged.yaml, ADR-0048), so the
# doors point at it rather than staying unconfigured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataplane
  namespace: default
  labels:
    app: dataplane
    phase: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataplane
  template:
    metadata:
      labels:
        app: dataplane
        phase: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: dataplane
        # Image mirrors deploy/dev/versions.env (DATAPLANE_IMAGE); dev-up.sh loads
        # it into the node, so a tag here and the record agree.
        image: docker.io/gitfrok/dataplane-app:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: GITFROK_POLICY_BUNDLE_DIR
          value: /etc/gitfrok/policy
        - name: GITFROK_LISTEN_ADDR
          value: ":8080"
        - name: GITFROK_GIT_STORAGE_ADDR
          value: "git-storaged:9000"
        - name: GITFROK_GIT_HTTP_ADDR
          value: ":8081"
        - name: GITFROK_POLICY_GRPC_ADDR
          value: ":9090"
        # Generated by dev-up.sh and upserted as a Secret, for the same reason the
        # TLS key is: a credential committed to the tree is a credential every
        # clone of the tree holds.
        - name: GITFROK_PAT_VERIFIER_KEY
          valueFrom:
            secretKeyRef:
              name: gitfrok-pat-verifier
              key: key
        # The queued-depth gauge KEDA scales on (T-0017 AC2). CI dispatch itself is
        # left unconfigured: the plane records jobs and launches none, because this
        # cluster has no gVisor RuntimeClass under a rootless driver and no runner
        # image exists to pin.
        - name: GITFROK_CI_METRICS_ADDR
          value: ":9102"
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        - name: git-http
          containerPort: 8081
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        - name: ci-metrics
          containerPort: 9102
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: policy-bundle
          mountPath: /etc/gitfrok/policy
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: policy-bundle
        configMap:
          name: gitfrok-policy-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: dataplane
  namespace: default
  labels:
    app: dataplane
    phase: "1"
spec:
  type: ClusterIP
  ports:
  - name: health
    port: 8080
    targetPort: health
    protocol: TCP
  - name: git-http
    port: 8081
    targetPort: git-http
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: grpc
    protocol: TCP
  # KEDA's metrics-api scaler reads ci_queued_jobs from this port.
  - name: ci-metrics
    port: 9102
    targetPort: ci-metrics
    protocol: TCP
  selector:
    app: dataplane
