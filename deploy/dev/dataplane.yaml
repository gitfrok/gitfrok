---
# The data plane (ADR-0025: one binary, every context composed inside it).
#
# The image reference is a placeholder that `dev-up.sh` substitutes for a *digest*
# before applying — never a tag. ADR-0035 requires first-party images to be
# digest-pinned, and that holds whether the digest came from a local build in
# minikube or from a published release (GITFROK_DEV_IMAGE_SOURCE selects which).
# Applying this file directly with `kubectl apply -f` therefore fails on purpose:
# an unresolved placeholder is a loud error rather than a silently mutable tag.
apiVersion: v1
kind: Service
metadata:
  name: dataplane
  namespace: default
  labels:
    app: dataplane
    phase: "1"
spec:
  selector:
    app: dataplane
  ports:
  - name: git-http
    port: 8080
    targetPort: git-http
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: grpc
    protocol: TCP
  - name: ci-metrics
    port: 9102
    targetPort: ci-metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataplane
  namespace: default
  labels:
    app: dataplane
    phase: "1"
spec:
  # KEDA owns this number once the ScaledObject exists; it is set here only so the
  # first rollout has something to start.
  replicas: 1
  selector:
    matchLabels:
      app: dataplane
  template:
    metadata:
      labels:
        app: dataplane
        phase: "1"
    spec:
      containers:
      - name: dataplane-app
        image: GITFROK_IMAGE_DATAPLANE
        imagePullPolicy: IfNotPresent
        ports:
        - name: git-http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        - name: ci-metrics
          containerPort: 9102
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        env:
        # The OPA bundle governance owns. The plane refuses to start without it,
        # because a plane with no policy denies everything and reaches an operator
        # as an unexplained outage (ADR-0006, invariant 2).
        - name: GITFROK_POLICY_BUNDLE_DIR
          value: /etc/gitfrok/policy
        - name: GITFROK_LISTEN_ADDR
          value: ":8081"
        - name: GITFROK_GIT_HTTP_ADDR
          value: ":8080"
        - name: GITFROK_POLICY_GRPC_ADDR
          value: ":9090"
        # The PAT verifier key is generated by dev-up.sh and upserted as a Secret,
        # for the same reason the TLS key is: a credential committed to the tree is
        # a credential every clone of the tree holds.
        - name: GITFROK_PAT_VERIFIER_KEY
          valueFrom:
            secretKeyRef:
              name: gitfrok-pat-verifier
              key: key
        # git-storaged is a separate workload. Until its image exists this address
        # resolves to nothing, and the plane serves everything except the Git
        # transport — which is why no Git front door is configured above it.
        - name: GITFROK_GIT_STORAGE_ADDR
          value: "git-storaged:9000"
        # CI runner configuration is per-environment and digest-pinned (invariant
        # 13, ADR-0035). dev-up.sh substitutes the runner digest the same way it
        # substitutes this pod's own image.
        - name: GITFROK_CI_RUNNER_IMAGE
          value: GITFROK_IMAGE_CI_RUNNER
        - name: GITFROK_CI_RUNTIME_CLASS
          value: gvisor
        - name: GITFROK_CI_NAMESPACE
          value: default
        - name: GITFROK_CI_SOURCE_ENDPOINT
          value: "git-storaged:9000"
        - name: GITFROK_CI_SOURCE_CAPABILITY
          value: read-only-source
        - name: GITFROK_CI_RUNNER_COMMAND
          value: "/usr/bin/gitfrok-ci run"
        - name: GITFROK_CI_METRICS_ADDR
          value: ":9102"
        # The dev cluster has no gVisor RuntimeClass under a rootless driver, so
        # the launcher that would create real sandboxes is opted out of here. Set
        # this to anything else on a cluster that has one.
        - name: GITFROK_CI_LAUNCHER
          value: dev
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: policy
          mountPath: /etc/gitfrok/policy
          readOnly: true
      volumes:
      - name: policy
        configMap:
          name: gitfrok-policy-bundle
