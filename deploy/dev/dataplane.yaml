---
# T-0021: the data plane (ADR-0025 one modular-monolith binary per plane).
#
# It loads the OPA policy bundle the cluster publishes as a ConfigMap (ADR-0006,
# invariant 2) and exits non-zero without one — AC4. Its healthz endpoint on
# GITFROK_LISTEN_ADDR is the readiness/liveness probe target.
#
# The Git protocol front doors (T-0011) call GITFROK_GIT_STORAGE_ADDR. That
# storage tier is now deployed (deploy/dev/git-storaged.yaml, ADR-0048), so the
# doors point at it rather than staying unconfigured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataplane
  namespace: default
  labels:
    app: dataplane
    phase: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataplane
  template:
    metadata:
      labels:
        app: dataplane
        phase: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      # The OIDC issuer runs behind the same ingress (see the env block below).
      hostAliases:
      - ip: "192.168.49.2"
        hostnames:
        - zitadel.gitsaas.test
      containers:
      - name: dataplane
        # Image mirrors deploy/dev/versions.env (DATAPLANE_IMAGE); dev-up.sh loads
        # it into the node, so a tag here and the record agree.
        image: docker.io/gitfrok/dataplane-app:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: GITFROK_POLICY_BUNDLE_DIR
          value: /etc/gitfrok/policy
        - name: GITFROK_LISTEN_ADDR
          value: ":8080"
        # The audit sink (ADR-0007 composition): the plane's DSN onto the
        # tenant-scoped Postgres trail. The role must be gitfrok_app — db.Open
        # refuses superuser, because RLS has to actually bind.
        - name: GITFROK_DATABASE_URL
          value: "postgres://gitfrok_app:gitfrok_app@postgres:5432/gitfrok"
        - name: GITFROK_GIT_STORAGE_ADDR
          value: "git-storaged:9000"
        - name: GITFROK_GIT_HTTP_ADDR
          value: ":8081"
        - name: GITFROK_POLICY_GRPC_ADDR
          value: ":9090"
        # Generated by dev-up.sh and upserted as a Secret, for the same reason the
        # TLS key is: a credential committed to the tree is a credential every
        # clone of the tree holds.
        - name: GITFROK_PAT_VERIFIER_KEY
          valueFrom:
            secretKeyRef:
              name: gitfrok-pat-verifier
              key: key
        # The queued-depth gauge KEDA scales on (T-0017 AC2). CI dispatch itself is
        # left unconfigured: the plane records jobs and launches none, because this
        # cluster has no gVisor RuntimeClass under a rootless driver and no runner
        # image exists to pin.
        - name: GITFROK_CI_METRICS_ADDR
          value: ":9102"
        # The large-object tier: LFS objects today, CI artifacts and image blobs
        # later (ADR-0050, SPEC-0023).
        #
        # **This is the S3 adapter, not the FUSE mount, and that is deliberate.**
        # ADR-0050 decides the mount is the tier and ADR-0051 decides a privileged
        # DaemonSet produces it — but on this driver the mount does not reach the
        # node. It was tried: the DaemonSet mounts `fuse.seaweedfs` and the mount is
        # marked shared inside the pod, the node's `/` is shared, and the mount still
        # never appears in the node's table. The consumers then bind the plain
        # directory underneath and write objects to node-local disk while every read
        # on that node succeeds. See deploy/dev/seaweedfs-mount.yaml and
        # deploy/dev/README.md for the measurement.
        #
        # ADR-0050 decision 6 keeps the S3 adapter for exactly this case — "how a
        # deployment without a mount runs" — so the dev cluster uses it and the mount
        # path is exercised on a node that can propagate one.
        #
        # All five or none: a node with three of them has an operator who intended
        # LFS and a deployment that would refuse it.
        - name: GITFROK_SEAWEEDFS_S3_ENDPOINT
          value: "http://seaweedfs:8333"
        - name: GITFROK_SEAWEEDFS_S3_REGION
          value: "us-east-1"
        - name: GITFROK_SEAWEEDFS_S3_BUCKET
          value: "gitfrok"
        # Upserted by dev-up.sh, like the TLS key and the PAT verifier: a credential
        # committed to the tree is a credential every clone of the tree holds.
        - name: GITFROK_SEAWEEDFS_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: gitfrok-seaweedfs-s3
              key: access-key
        - name: GITFROK_SEAWEEDFS_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: gitfrok-seaweedfs-s3
              key: secret-key
        # Either way, this is what turns the plane's /info/lfs endpoints from
        # configured-absent into working, under repo.lfs.read / repo.lfs.write.
        # OIDC login (ADR-0045, T-0013). The identity module exchanges the code
        # and verifies the ID token here — never in the BFF — using the same
        # gitfrok-oidc ConfigMap dev-provision.sh writes (client id generated by
        # Zitadel; `bff` before first provisioning). authMethodType NONE means
        # no client secret; PKCE carries the proof. The resource-owner mapping
        # pins the identity org to the dev tenant id (tenant.tenants row comes
        # with tenant onboarding; the login path itself only needs a mapping).
        # Roles stay empty until project roles are granted, which is fine:
        # _allow_-exactly-whats-mapped is the PDP's job, not login's.
        - name: GITFROK_OIDC_ISSUER
          valueFrom:
            configMapKeyRef:
              name: gitfrok-oidc
              key: issuer
        - name: GITFROK_OIDC_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: gitfrok-oidc
              key: client-id
        - name: GITFROK_OIDC_REDIRECT_URI
          value: "https://app.gitsaas.test/callback"
        - name: GITFROK_OIDC_ROLE_CLAIM
          # Zitadel v4.16.2 emits granted project roles under the generic
          # SINGULAR claim (verified live: {"owner":{orgId:orgDomain}}; the
          # identity verifier reads the map's keys as role names). The plural
          # name this carried before is never populated by v4. Roles only
          # appear once the project's projectRoleAssertion flag is on —
          # dev-provision.sh converges it together with the grants.
          value: "urn:zitadel:iam:org:project:roles"
        - name: GITFROK_OIDC_ALLOWED_ROLES
          # The reviewed role vocabulary (ADR-0045 line 44: vocabulary changes
          # carry governance/policy review — this set is exactly the roles the
          # authz policy reasons about: owner/member/reader).
          value: "owner,member,reader"
        - name: GITFROK_OIDC_TENANT_MAPPING
          # Written by dev-provision.sh (the org id is instance-generated and
          # differs per fresh Zitadel): maps the dev org to the dev tenant id.
          valueFrom:
            configMapKeyRef:
              name: gitfrok-oidc
              key: tenant-mapping
        # ---- Agent mode (T-0031, SPEC-0039 AC1, Stage C of the North Star).
        # The agent dials the control plane OUTBOUND (ADR-0011); there is no
        # inbound path. Setting this address makes the other agent envs REQUIRED
        # at config time (loadAgentClientConfig exits non-zero on any gap), while
        # connection/enrolment failures at runtime are logged and never fatal —
        # the pod stays up and its doors keep serving while un-enrolled.
        - name: GITFROK_AGENT_GATEWAY_ADDR
          value: "controlplane:9091"
        # DEV FICTION, annotated per Stage C: this cluster is minikube/podman,
        # not GKE. The cloud + settings satisfy the driver seam's install-time
        # contract (platform/clouddriver refuses an install that does not say
        # what it is); the real-cluster proof is T-0042's, not this fiction's.
        - name: GITFROK_CLOUD
          value: "gke"
        - name: GITFROK_CLOUD_SETTINGS
          value: "gke.workloadIdentityServiceAccount=dev-dataplane@gitsaas-dev.iam"
        - name: GITFROK_REGION
          value: "europe-west1"
        # The pinned control-plane CA bundle (agent.caBundleConfigMap's shape in
        # the BYO chart: one ConfigMap, key ca.pem). dev-provision.sh derives it
        # from the durable agent-CA snapshot the controlplane persists (the CA is
        # minted at the controlplane's first start with its issuer door open;
        # RUNBOOK §6b has no earlier source). Until that ConfigMap exists this
        # pod cannot start in agent mode — by contract: an agent that cannot pin
        # the control plane's CA must not connect.
        - name: GITFROK_AGENT_CA_BUNDLE
          value: /etc/gitfrok/agent-ca/ca.pem
        # Pod-local emptyDir: the credential lives only as long as the pod (the
        # enrolment record on the control plane is the durable half).
        - name: GITFROK_AGENT_CREDENTIAL_PATH
          value: /var/lib/gitfrok/agent/credential.pem
        # The one-time enrolment token (SPEC-0038). Contract note: the pinned
        # binary REQUIRES this env non-empty whenever the gateway address is set
        # — an absent token is a config error, not a wait state. dev-provision.sh
        # therefore converges a placeholder Secret so the pod STARTS un-enrolled
        # (Bootstrap then fails at runtime, logged, non-fatal); Stage D's proof
        # flow mints the real token through the enrolment door, replaces this
        # Secret and restarts the pod. optional:true keeps a fresh cluster from
        # crash-looping on env resolution before provisioning ran.
        - name: GITFROK_ENROLMENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitfrok-enrolment-token
              key: token
              optional: true
        # Same in-cluster issuer reachability as the BFF: public URL for
        # discovery/JWKS/token, dev-only DNS alias + mkcert CA (Go honors
        # SSL_CERT_DIR). Trouble reaching the issuer shows as every login
        # failing with code/verification errors, which is why this is wired
        # together rather than left to "fix later".
        - name: SSL_CERT_DIR
          value: "/etc/ssl/gitsaas"
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        - name: git-http
          containerPort: 8081
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        - name: ci-metrics
          containerPort: 9102
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: policy-bundle
          mountPath: /etc/gitfrok/policy
          readOnly: true
        - name: gitsaas-ca
          mountPath: /etc/ssl/gitsaas
          readOnly: true
        - name: agent-ca-bundle
          mountPath: /etc/gitfrok/agent-ca
          readOnly: true
        - name: agent-credential
          mountPath: /var/lib/gitfrok/agent
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: policy-bundle
        configMap:
          name: gitfrok-policy-bundle
      - name: gitsaas-ca
        secret:
          secretName: gitsaas-ca
          items:
          - key: ca.crt
            path: ca.crt
      # Written by dev-provision.sh from the controlplane's durable agent-CA
      # snapshot (key ca.pem); optional so a fresh cluster's first rollout
      # survives until provisioning derives it.
      - name: agent-ca-bundle
        configMap:
          name: gitfrok-agent-ca
          optional: true
          items:
          - key: ca.pem
            path: ca.pem
      - name: agent-credential
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dataplane
  namespace: default
  labels:
    app: dataplane
    phase: "1"
spec:
  type: ClusterIP
  ports:
  - name: health
    port: 8080
    targetPort: health
    protocol: TCP
  - name: git-http
    port: 8081
    targetPort: git-http
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: grpc
    protocol: TCP
  # KEDA's metrics-api scaler reads ci_queued_jobs from this port.
  - name: ci-metrics
    port: 9102
    targetPort: ci-metrics
    protocol: TCP
  selector:
    app: dataplane
