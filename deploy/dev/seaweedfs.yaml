---
# SeaweedFS 4.40 deployment for local Minikube dev environment
# S3-compatible blob storage (git storage tier reference, ADR-0016)
# Image tag mirrors deploy/dev/versions.env (ADR-0023) — copied by hand; nothing sources that file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-pvc
  namespace: default
  labels:
    app: seaweedfs
    phase: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: default
  labels:
    app: seaweedfs
    phase: "0"
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: this pod mounts a ReadWriteOnce PVC, so a rolling
  # update would start the replacement while the old one still holds the volume. The two then
  # fight over on-disk locks and the rollout deadlocks — the old pod will not terminate until the
  # new one is Ready, and the new one cannot become Ready until the old one lets go.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
        phase: "0"
    spec:
      containers:
      - name: seaweedfs
        image: docker.io/chrislusf/seaweedfs:4.40
        imagePullPolicy: IfNotPresent
        ports:
        - name: master
          containerPort: 9333
          protocol: TCP
        - name: filer
          containerPort: 8888
          protocol: TCP
        # The filer's gRPC port, which SeaweedFS derives as HTTP+10000 and never
        # announces. `weed mount` uses the HTTP port only to *look up* this one and
        # then does all its work here — so a Service without it produces a mount
        # client that retries "i/o timeout" against 18888 forever while the filer
        # sits healthy on 8888. Found by running it (ADR-0051).
        - name: filer-grpc
          containerPort: 18888
          protocol: TCP
        - name: s3
          containerPort: 8333
          protocol: TCP
        args:
          # `server` (not `all` — no such subcommand in 4.40: it is master|volume|filer|s3|server)
          # runs master + volume in one process; -filer and -s3 add the two gateways this dev env
          # routes to, filer.gitsaas.test:8888 and s3.gitsaas.test:8333.
          - server
          - -filer
          - -s3
          - -s3.config=/etc/seaweedfs/s3_config.json
          - -dir=/data
          - -master.port=9333
          - -filer.port=8888
          - -s3.port=8333
        env:
        - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
          value: "1"
        - name: WEED_MASTER_VOLUME_GROWTH_COPY_2
          value: "2"
        - name: WEED_FILER_BUCKETS_FOLDER
          value: /data/buckets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: master
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            # /status 404s on the master ("volume id status not found" — it falls through to a
            # volume-id lookup). /cluster/status is the master's health endpoint and returns
            # {"IsLeader":true,...}. With the wrong path the pod never becomes Ready and the
            # rollout blocks forever, which is how this manifest looked "applied but broken".
            path: /cluster/status
            port: master
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/seaweedfs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-pvc
      - name: config
        configMap:
          name: seaweedfs-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  namespace: default
  labels:
    app: seaweedfs
    phase: "0"
data:
  # The identity is named `gitfrok`, NOT `anonymous`, and the difference is the whole
  # of the endpoint's access control. `anonymous` is SeaweedFS's *unauthenticated*
  # identity: attaching credentials to it grants its actions to every request that
  # arrives without a signature, so the gateway served any object to anyone who could
  # reach it. That was tolerable while nothing lived there. It stopped being tolerable
  # when this became the large-object tier (ADR-0050) and started holding tenant LFS
  # data behind an ingress host.
  #
  # Caught by running backend's live objectstore suite against this cluster:
  # TestLiveSeaweedFSRefusesAnUnsignedRequest failed with "the bucket is public, and
  # every other assertion about scoped credentials in this suite is vacuous" — which
  # is exactly right, and is why that test exists alongside the presign one.
  s3_config.json: |
    {
      "identities": [
        {
          "name": "gitfrok",
          "credentials": [
            {
              "accessKey": "minioadmin",
              "secretKey": "minioadmin"
            }
          ],
          "actions": [
            "Read",
            "Write",
            "List"
          ]
        }
      ],
      "buckets": []
    }

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: default
  labels:
    app: seaweedfs
    phase: "0"
spec:
  type: ClusterIP
  ports:
  - name: master
    port: 9333
    targetPort: master
    protocol: TCP
  - name: filer
    port: 8888
    targetPort: filer
    protocol: TCP
  # Required by the seaweedfs-mount DaemonSet; see the container port above.
  - name: filer-grpc
    port: 18888
    targetPort: filer-grpc
    protocol: TCP
  - name: s3
    port: 8333
    targetPort: s3
    protocol: TCP
  selector:
    app: seaweedfs

# There is deliberately no `s3.gitsaas.test` Service here. Service names must be RFC 1035 DNS
# labels, so a dotted name is rejected by the API server — and it would not have produced that
# hostname anyway: in-cluster DNS is always <service>.<namespace>.svc.cluster.local. The
# s3.gitsaas.test host is routed by ingress.yaml; in-cluster clients use seaweedfs:8333.
