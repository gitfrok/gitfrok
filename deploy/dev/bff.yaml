---
# T-0015: the BFF (Backend-for-Frontend), aggregation only (invariant 18).
#
# It is the web frontend's sole upstream (invariant 22): it shapes RepositoryReader
# (git-storaged) results into the SPEC-0021 browser surface, serves the OIDC login
# flow, and owns the browser session (ADR-0049). It never reaches a datastore and
# never decides anything itself; every decision stays behind the backend's PDP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: default
  labels:
    app: bff
    phase: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
        phase: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      # The issuer URL is the public one (the browser must follow the authorize
      # redirect), but in dev only the host resolves *.gitsaas.test (dnsmasq).
      # The alias pins the minikube ingress IP so the pod can reach the issuer
      # through the same route the browser takes; the CA mount makes the mkcert
      # cert trustable in-cluster (Go reads SSL_CERT_DIR). dev-up.sh writes the
      # gitsaas-ca secret from $(mkcert -CAROOT)/rootCA.pem and converges both.
      hostAliases:
      - ip: "192.168.49.2"
        hostnames:
        - zitadel.gitsaas.test
      initContainers:
      # The BFF refuses to start without its configured session store (ADR-0052
      # decision 4), which is correct and would otherwise show up as a CrashLoop
      # race on a cold cluster: both are applied in the same pass and Valkey is
      # not ready the instant the BFF is. Waiting here keeps the failure meaning
      # "Valkey is broken" rather than "Valkey was slow", the same shape as
      # zitadel's db-wait.
      - name: valkey-wait
        image: docker.io/library/busybox:1.35.0
        command:
          - sh
          - -c
          - |
            until nc -z valkey 6379; do
              echo "Waiting for Valkey..."
              sleep 2
            done
            echo "Valkey is ready"
      containers:
      - name: bff
        # Image mirrors deploy/dev/versions.env (BFF_IMAGE); dev-up.sh loads it
        # into the node, so a tag here and the record agree.
        image: docker.io/gitfrok/bff:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        # The data plane's policy door serves PDP, codereview, CI and OIDC on one
        # gRPC listener (ADR-0041).
        - name: GITFROK_PDP_ADDR
          value: "dataplane:9090"
        - name: GITFROK_REPOSITORY_READER_ADDR
          value: "git-storaged:9000"
        # The control plane's UsageService door (T-0034, SPEC-0041), mounted by
        # Stage C: the tenant's fair-use view, rendered by the BFF. Unset meant
        # the usage surface stayed unmounted and the route answered 404; the
        # door itself is plaintext in dev, same posture as the policy door.
        - name: GITFROK_USAGE_ADDR
          value: "controlplane:9092"
        - name: GITFROK_BFF_LISTEN_ADDR
          value: ":8080"
        # OIDC login (ADR-0045). The issuer is Zitadel, which the dev cluster
        # already deploys. The client id is written by dev-provision.sh into the
        # ConfigMap gitfrok-oidc (Zitadel generates client ids server-side; `bff`
        # is only the dev-up seed/placeholder). Update of the ConfigMap is followed
        # by a bff rollout restart inside dev-provision.sh so the pod picks it up.
        - name: GITFROK_OIDC_ISSUER
          value: "https://zitadel.gitsaas.test"
        - name: GITFROK_OIDC_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: gitfrok-oidc
              key: client-id
        - name: GITFROK_OIDC_REDIRECT_URI
          value: "https://app.gitsaas.test/callback"
        # `urn:zitadel:iam:user:resourceowner` is what makes Zitadel include the
        # resource-owner claims the tenant mapping reads (ADR-0045): without it
        # the ID token carries no owner and every login maps to no tenant.
        - name: GITFROK_OIDC_SCOPE
          value: "openid profile email urn:zitadel:iam:user:resourceowner"
        # The session store ADR-0049 decision 5 names, opened by the BFF itself
        # under the one waiver ADR-0052 grants. Valkey rather than memory even in
        # dev, because memory is what makes a rollout log every user out — and a
        # store that cannot be reached is fatal at startup rather than a silent
        # fallback (ADR-0052 decision 4), so a broken cache surfaces here as a
        # BFF that refuses to start instead of one that quietly forgets people.
        - name: GITFROK_SESSION_STORE
          value: "valkey"
        - name: GITFROK_SESSION_VALKEY_ADDR
          value: "valkey:6379"
        - name: SSL_CERT_DIR
          value: "/etc/ssl/gitsaas"
        volumeMounts:
        - name: gitsaas-ca
          mountPath: /etc/ssl/gitsaas
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: gitsaas-ca
        secret:
          secretName: gitsaas-ca
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: default
  labels:
    app: bff
    phase: "1"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: bff
