---
# Zitadel identity service deployment for local Minikube dev environment
# OIDC/OAuth2 provider. Image tag mirrors deploy/dev/versions.env (ADR-0023) — copied by hand;
# nothing sources that file, and `:latest` is not a pin.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-pvc
  namespace: default
  labels:
    app: zitadel
    phase: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Bootstrap volume shared with the Login V2 UI (zitadel-login.yaml). The FirstInstance setup
# writes the login-client PAT here (ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH); the login UI
# mounts the same PVC read-only. A PVC rather than a Secret + kubectl cp dance: the setup job
# writes this file exactly once (on first instance creation), so the file must survive pod
# restarts — the instance stays in Postgres, an emptyDir would not.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-bootstrap-pvc
  namespace: default
  labels:
    app: zitadel
    phase: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: default
  labels:
    app: zitadel
    phase: "0"
data:
  # Runtime config. ExternalSecure with TLS.Enabled false is the "TLS terminates at the ingress"
  # shape: Zitadel mints https:// URLs for the console and OIDC discovery but serves plaintext
  # h2c to the ingress. Getting this pair wrong is what makes Zitadel emit http:// redirect URIs
  # that then fail OIDC validation.
  zitadel.yaml: |
    # Zitadel minimal local dev configuration (T-0013 will extend)
    Log:
      Level: info
    Port: 8080
    ExternalDomain: zitadel.gitsaas.test
    ExternalPort: 443
    ExternalSecure: true
    TLS:
      Enabled: false
    Database:
      postgres:
        Host: postgres
        Port: 5432
        Database: zitadel
        MaxOpenConns: 15
        MaxIdleConns: 5
        # Zitadel owns its own database and role rather than sharing `gitfrok` with the app: its
        # migrations create and alter schemas wholesale, and the app's RLS baseline should not be
        # in reach of them. Admin creds are used once, by start-from-init, to create both.
        User:
          Username: zitadel
          Password: zitadel
          SSL:
            Mode: disable
        Admin:
          Username: postgres
          Password: postgres
          SSL:
            Mode: disable
  # Setup steps, applied once by start-from-init. FirstInstance is only read from the --steps file,
  # never from --config, which is why this is a separate key.
  steps.yaml: |
    FirstInstance:
      InstanceName: Gitfrok
      Org:
        Name: Gitfrok Org
        Human:
          UserName: admin@gitsaas.test
          Password: ChangeMe123!
          PasswordChangeRequired: false
          Email:
            Address: admin@gitsaas.test
            Verified: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: default
  labels:
    app: zitadel
    phase: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zitadel
        phase: "0"
    spec:
      # Kubernetes injects <SVC>_PORT=tcp://<clusterIP>:<port> for every Service in the namespace.
      # The Service here is named `zitadel`, so pods get ZITADEL_PORT=tcp://10.x.x.x:8080 — and
      # Zitadel's own config reader consumes ZITADEL_-prefixed env vars, so that URL lands on config
      # key `Port` and boot fails with "'Port' cannot parse value as 'uint16'". Nothing in this pod
      # needs service-link env vars; every address it uses is a DNS name from its ConfigMap.
      enableServiceLinks: false
      serviceAccountName: zitadel
      initContainers:
      # Zitadel requires database to be ready first
      - name: db-wait
        image: docker.io/library/busybox:1.35.0
        command:
          - sh
          - -c
          - |
            until nc -z postgres 5432; do
              echo "Waiting for PostgreSQL..."
              sleep 2
            done
            echo "PostgreSQL is ready"
      containers:
      - name: zitadel
        image: ghcr.io/zitadel/zitadel:v4.16.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # No `command:` — the image entrypoint is the zitadel binary, so these are its subcommand
        # and flags. `ready` (the previous value) is the one-shot readiness *probe* subcommand: it
        # checks a running instance and exits, so the pod crash-looped without ever serving.
        # start-from-init runs first-boot setup (schema, FirstInstance) and then starts the server;
        # it is idempotent, so restarts skip the setup steps.
        args:
        - start-from-init
        - --config=/etc/zitadel/zitadel.yaml
        - --steps=/etc/zitadel/steps.yaml
        - --masterkey=$(ZITADEL_MASTERKEY)
        # TLS terminates at the ingress; without this Zitadel refuses to serve plaintext.
        # camelCase is not a typo — the flag is --tlsMode; --tls-mode makes Zitadel exit with
        # "unknown flag" before it logs anything else.
        - --tlsMode=external
        env:
        # Must be exactly 32 bytes — Zitadel refuses to boot otherwise. Dev-only value; a real
        # deployment takes this from a secret manager, never from a manifest.
        - name: ZITADEL_MASTERKEY
          value: "gitfrok-dev-masterkey-0123456789"
        # FirstInstance setup: create the login-client machine user (IAM_LOGIN_CLIENT) and write
        # its PAT to the shared bootstrap volume for the Login V2 UI to consume. Applied only on
        # first setup of a new instance (the mirror of the Docker Compose pack's
        # ZITADEL_FIRSTINSTANCE_* defaults — scripts/dev-provision.sh depends on the file
        # existing at /zitadel/bootstrap/login-client.pat).
        - name: ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH
          value: /zitadel/bootstrap/login-client.pat
        - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME
          value: login-client
        - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME
          value: Automatically Initialized IAM_LOGIN_CLIENT
        - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE
          value: "2099-01-01T00:00:00Z"
        # DefaultInstance: every new instance gets Login V2 required, hosted at /ui/v2/login on
        # the Zitadel host, with the OIDC/SAML redirect URLs pointed at the Login UI. These match
        # the Compose pack so the dev cluster and the reference deployment agree (ADR-0024).
        - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED
          value: "true"
        - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI
          value: "https://zitadel.gitsaas.test/ui/v2/login/"
        - name: ZITADEL_OIDC_DEFAULTLOGINURLV2
          value: "https://zitadel.gitsaas.test/ui/v2/login/login?authRequest="
        - name: ZITADEL_OIDC_DEFAULTLOGOUTURLV2
          value: "https://zitadel.gitsaas.test/ui/v2/login/logout?post_logout_redirect="
        - name: ZITADEL_SAML_DEFAULTLOGINURLV2
          value: "https://zitadel.gitsaas.test/ui/v2/login/login?samlRequest="
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /debug/healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /debug/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/zitadel
        - name: data
          mountPath: /zitadel/data
        - name: bootstrap
          mountPath: /zitadel/bootstrap
      volumes:
      - name: config
        configMap:
          name: zitadel-config
      - name: data
        persistentVolumeClaim:
          claimName: zitadel-pvc
      - name: bootstrap
        persistentVolumeClaim:
          claimName: zitadel-bootstrap-pvc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel
  namespace: default
  labels:
    app: zitadel
    phase: "0"

---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
  namespace: default
  labels:
    app: zitadel
    phase: "0"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: zitadel
