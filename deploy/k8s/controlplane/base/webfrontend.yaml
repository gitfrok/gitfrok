---
# Astro SSR in front of the BFF. It never reaches the BFF's dependencies directly and never reaches
# a data plane at all (invariant 22): one origin, one hop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webfrontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webfrontend
  template:
    metadata:
      labels:
        app: webfrontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: webfrontend
          image: docker.io/gitfrok/webfrontend:0.1.0
          env:
            - name: GITFROK_BFF_ORIGIN
              value: "http://bff:8080"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          ports:
            - name: http
              containerPort: 4321
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: webfrontend
spec:
  type: ClusterIP
  selector:
    app: webfrontend
  ports:
    - name: http
      port: 4321
      targetPort: http
