---
# The BFF, configured as a CONTROL-plane deployment (ADR-0094 decisions 4 and 5).
#
# It renders no repository content, so it names NO RepositoryReader address — and under SPEC-0070
# AC2 that is not merely unnecessary but required: a control-plane deployment must REFUSE TO START
# with one configured. The refusal is the enforcement, which is why the address is absent rather
# than empty.
#
# An earlier version of this file took the address from a ConfigMap the installer does not create,
# with a comment arguing that no valid control-plane value exists. The comment was right about the
# problem and wrong about the remedy: reading ADR-0094 decision 5 properly shows the answer is not a
# value an operator supplies, it is the absence of the input plus a boot refusal. Recorded because a
# confident comment is the kind of thing a reader trusts.
#
# IT STILL CANNOT START, and the reason has moved one line down. main.go also requires
# GITFROK_PDP_ADDR — correctly, since it "must not serve requests it cannot check" — and the only
# PDP is the data plane's :9090, which ADR-0094 decision 7 forbids this deployment to dial. The
# control plane opens 9091 agent, 9092 usage, 9093 residency and 9094 enrolment, and no PDP door.
# That is SPEC-0070's blocking open question 1, and no manifest can answer it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: bff
          image: asia-southeast1-docker.pkg.dev/gitfrok-prod-cp/gitfrok/bff:0.1.0
          env:
            - name: GITFROK_BFF_LISTEN_ADDR
              value: ":8080"
            # The plane input SPEC-0070 AC1 requires. No default exists in the binary, deliberately:
            # a default would silently pick a route set.
            - name: GITFROK_PLANE
              value: "control"
            # The control plane's own usage door — in-cluster, same plane, no ADR-0011 question.
            - name: GITFROK_USAGE_ADDR
              value: "controlplane:9092"
            # GITFROK_REPOSITORY_READER_ADDR IS DELIBERATELY ABSENT, not omitted by oversight.
            # SPEC-0070 AC2: a control-plane deployment refuses to start with one configured.
            #
            # GITFROK_PDP_ADDR is absent for a different and worse reason — there is nothing valid to
            # put in it. The only PDP is the data plane's, which decision 7 forbids this deployment
            # to reach, and the control plane serves none. SPEC-0070 open question 1 owns that, and
            # an address invented here would be the wrong kind of fix.
            # OIDC (ADR-0045). Issuer and redirect are environment facts and come from the overlay.
            # The client id is a ConfigMap because Zitadel generates it server-side — it is an
            # identifier, not a credential, and the shipped BFF reads no client secret at all.
            - name: GITFROK_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: gitfrok-oidc
                  key: client-id
            - name: GITFROK_OIDC_SCOPE
              value: "openid profile email urn:zitadel:iam:user:resourceowner"
            # A store that cannot be reached is fatal at startup rather than a silent fallback
            # (ADR-0052 decision 4), so a broken cache surfaces as a BFF that refuses to start
            # instead of one that quietly forgets people.
            - name: GITFROK_SESSION_STORE
              value: "valkey"
            - name: GITFROK_SESSION_VALKEY_ADDR
              value: "valkey:6379"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bff
spec:
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: http
      port: 8080
      targetPort: http
