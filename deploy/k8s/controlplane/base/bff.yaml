---
# The BFF, and the one workload in this installer that CANNOT START as rendered. That is recorded
# rather than worked around, because working around it would mean breaking ADR-0011.
#
# bff/cmd/bff/main.go requires GITFROK_REPOSITORY_READER_ADDR and exits without it ("without
# RepositoryReader the browser has no data to show"). That reader is git-storaged, which is
# DATA-plane-side. So the control-plane BFF needs an address it must not have:
#
#   - setting it to a data-plane address makes a control-plane process dial a data plane, which
#     ADR-0011 forbids and `CheckNoDataPlaneDial` asserts;
#   - omitting it makes the binary exit.
#
# ADR-0093 surfaced exactly this as its blocking gap and ADR-0094 settled it in principle — the
# repository surface is served data-plane-side by its own bff+webfrontend pair, so a CONTROL-plane
# BFF should not need a reader at all. The code has not caught up, and ADR-0094's register row says
# nothing moves in bff/ until SPEC-0021 is amended for the data-plane premise.
#
# So the address is taken from a ConfigMap this installer does NOT create. An operator who supplies
# one is making the ADR-0011 decision themselves, visibly, rather than inheriting it from a manifest.
# SPEC-0067 open question 5 is this: meeting the spec does not produce a working control plane.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: bff
          image: docker.io/gitfrok/bff:0.1.0
          env:
            - name: GITFROK_BFF_LISTEN_ADDR
              value: ":8080"
            # The control plane's own usage door — in-cluster, same plane, no ADR-0011 question.
            - name: GITFROK_USAGE_ADDR
              value: "controlplane:9092"
            # See the header. Both of these name data-plane services and have no valid
            # control-plane value today; they are inputs an operator must decide on, and the
            # installer supplies neither.
            - name: GITFROK_PDP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gitfrok-bff-endpoints
                  key: pdp-addr
            - name: GITFROK_REPOSITORY_READER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gitfrok-bff-endpoints
                  key: repository-reader-addr
            # OIDC (ADR-0045). Issuer and redirect are environment facts and come from the overlay.
            # The client id is a ConfigMap because Zitadel generates it server-side — it is an
            # identifier, not a credential, and the shipped BFF reads no client secret at all.
            - name: GITFROK_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: gitfrok-oidc
                  key: client-id
            - name: GITFROK_OIDC_SCOPE
              value: "openid profile email urn:zitadel:iam:user:resourceowner"
            # A store that cannot be reached is fatal at startup rather than a silent fallback
            # (ADR-0052 decision 4), so a broken cache surfaces as a BFF that refuses to start
            # instead of one that quietly forgets people.
            - name: GITFROK_SESSION_STORE
              value: "valkey"
            - name: GITFROK_SESSION_VALKEY_ADDR
              value: "valkey:6379"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bff
spec:
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: http
      port: 8080
      targetPort: http
