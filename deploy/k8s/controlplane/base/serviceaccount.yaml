---
# The custody consumer identity. The control plane's projected service-account token is its ONLY
# credential toward the custody service: OpenBao's Kubernetes-auth role binds exactly this account
# and the adapter exchanges the token for a short-lived credential at login (ADR-0066 decision 5).
# Zero static credentials on either side, which is why nothing here has a key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlplane
