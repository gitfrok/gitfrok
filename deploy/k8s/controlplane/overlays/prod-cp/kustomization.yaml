# ADR-0092's control-plane environment (live/prod-cp). One overlay exists today; ADR-0096's register
# row asks for a stated rule about what a second may vary, and SPEC-0067 AC11 is that rule for now:
# hostnames, addresses, replicas and image digests, never which workloads exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitfrok

resources:
  # The namespace comes first because everything else lands in it. `namespace:` above only rewrites
  # metadata; it creates nothing.
  - namespace.yaml
  - ../../base
  - gateway.yaml
  - agent-door.yaml

patches:
  - path: patch-endpoints.yaml

# ADR-0096 decision 9 / ADR-0034-0035: one declarative entry per image, pinned by DIGEST.
#
# AC5 IS STILL NOT MET, AND IS STILL NOT SILENTLY PASSED — but the reason has narrowed. ADR-0098
# settled WHERE the images live; nothing has published them there yet, so there is no digest to pin.
# `check-controlplane-kustomize.sh` reports AC5 as NOT RUN with that cause on its own output line.
#
# When the image-publish workflow runs, each entry gains `digest: sha256:...` and drops `newTag`,
# read from the `.release` manifest the same run signs. That is the moment AC5 closes, and the
# release manifest rather than a human is where the value comes from.
images:
  - name: asia-southeast1-docker.pkg.dev/gitfrok-prod-cp/gitfrok/controlplane-app
    newTag: 0.1.0
  - name: asia-southeast1-docker.pkg.dev/gitfrok-prod-cp/gitfrok/bff
    newTag: 0.1.0
  - name: asia-southeast1-docker.pkg.dev/gitfrok-prod-cp/gitfrok/webfrontend
    newTag: 0.1.0
