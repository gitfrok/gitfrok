---
# The environment facts: the two hostnames ADR-0095 fixed, and the SANs the agent gateway's
# certificate must carry. Everything else stays in base/, which is what keeps AC11's rule — an
# overlay varies hostnames, addresses, replicas and digests, never which workloads exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
spec:
  template:
    spec:
      containers:
        - name: controlplane
          env:
            # The certificate the custody-backed CA mints for the agent door. It must carry the
            # public name, because that is the name the agent verifies against.
            - name: GITFROK_AGENT_SERVER_NAMES
              value: "agents-gitfrok.7.solutions,controlplane"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  template:
    spec:
      containers:
        - name: bff
          env:
            - name: GITFROK_OIDC_ISSUER
              value: "https://auth-gitfrok.7.solutions"
            - name: GITFROK_OIDC_REDIRECT_URI
              value: "https://app-gitfrok.7.solutions/callback"
