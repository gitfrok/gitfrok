---
# ADR-0095 decision 2: the browser and issuer surfaces share one Gateway on GKE's MANAGED
# controller, which is why this installer contains no ingress controller of its own.
#
# The :80 listener is not a redirect convenience — ADR-0095 decision 7 issues certificates over ACME
# HTTP-01 through this Gateway precisely so that no Cloudflare credential has to live in the
# cluster. Remove the listener and issuance stops; the running certificates keep working until they
# expire, so the breakage arrives up to 90 days later.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gitfrok-cp
spec:
  gatewayClassName: gke-l7-global-external-managed

  # The reserved global address ADR-0095 decision 6 requires, referenced BY NAME so the DNS record
  # and the Gateway agree.
  #
  # THIS WAS `networking.gke.io/addresses` AS AN ANNOTATION UNTIL 2026-09-22, AND GKE SILENTLY
  # IGNORED IT. That annotation is an *Ingress* mechanism; the Gateway API equivalent is this
  # `spec.addresses` block. The failure has no error: the Gateway reports PROGRAMMED=True and
  # serves happily — on an address it auto-provisioned for itself
  # (`gkegw1-osku-...`, 34.98.93.111), while `prod-cp-gateway` sat RESERVED and unused and every
  # DNS record pointed at the wrong IP. Found only by comparing the Gateway's address against
  # `gcloud compute addresses list`; patching to this form moved it onto the reserved address
  # within a minute.
  addresses:
    - type: NamedAddress
      value: prod-cp-gateway
  listeners:
    - name: acme-http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: app-https
      protocol: HTTPS
      port: 443
      hostname: app-gitfrok.7.solutions
      tls:
        mode: Terminate
        certificateRefs:
          # cert-manager CREATES this Secret at runtime; this installer only names it. Referencing
          # a Secret is not authoring one, which is the distinction SPEC-0067 AC3 turns on.
          - name: app-gitfrok-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: auth-https
      protocol: HTTPS
      port: 443
      hostname: auth-gitfrok.7.solutions
      tls:
        mode: Terminate
        certificateRefs:
          - name: auth-gitfrok-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-gitfrok
spec:
  parentRefs:
    - name: gitfrok-cp
      sectionName: app-https
  hostnames:
    - app-gitfrok.7.solutions
  rules:
    - backendRefs:
        - name: webfrontend
          port: 4321
---
# auth-gitfrok routes to Zitadel, which this installer does NOT render: ADR-0093 decision 2 makes it
# a required input, and ADR-0095 force 3 gives it its own hostname because ExternalDomain is baked
# into what its OIDC discovery document advertises. So this route dangles until Zitadel is installed
# by whatever owns the third-party stateful set — an open row that blocks a first deployment.
# A backendRef is a reference, not a workload, so AC2 still holds.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-gitfrok
spec:
  parentRefs:
    - name: gitfrok-cp
      sectionName: auth-https
  hostnames:
    - auth-gitfrok.7.solutions
  rules:
    - backendRefs:
        - name: zitadel
          port: 8080
---
# GKE GATEWAY DOES NOT INFER A HEALTH CHECK FROM THE READINESS PROBE. That inference is an
# Ingress + BackendConfig behaviour; the Gateway controller defaults to `GET /` expecting 200 and
# looks at nothing else.
#
# Zitadel's Deployment declares `readinessProbe: /debug/ready` and answers 404 on `/`. So the
# default check marked its backend UNHEALTHY while the pods were Ready and `auth-gitfrok` served
# 502/503 for an hour on 2026-09-22 — with every Kubernetes-side signal green. This policy is the
# fix, and it is in the installer rather than in an operator's shell history because the next
# cluster would reproduce the outage exactly.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: zitadel
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /debug/ready
        portSpecification: USE_SERVING_PORT
  targetRef:
    group: ""
    kind: Service
    name: zitadel
