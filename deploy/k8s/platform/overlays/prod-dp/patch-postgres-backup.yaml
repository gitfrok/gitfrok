---
# The data plane's own bucket, in its own project. Separate from prod-cp's because a shared backup
# target would be a path between planes, and ADR-0092 decision 2's whole point is that there is none.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # See prod-cp's copy for why this is required and why it cannot come from OpenTofu. Its own
  # project, its own service account: `ksa_annotations["gitfrok/postgres"]` from
  # ../../../gcp/live/prod-dp/workload-identity, which is a different email to prod-cp's by
  # ADR-0092 decision 2 — there is no shared identity between the planes either.
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: prod-dp-postgres@gitfrok-prod-dp.iam.gserviceaccount.com
  backup:
    barmanObjectStore:
      destinationPath: "gs://gitfrok-prod-dp-postgres-backups/postgres"
      googleCredentials:
        gkeEnvironment: true
    retentionPolicy: "30d"
