---
# The ONE component here that is correctly a Deployment: Zitadel is stateless given Postgres, so
# replicas buy availability and cost nothing in consistency. AC2 exempts it by name, which is why
# the exemption is a list rather than a judgement the gate has to make.
#
# Its hostname is not incidental. ADR-0095 force 3: ExternalDomain is baked into what its OIDC
# discovery document advertises, which is why auth-gitfrok.7.solutions exists as its own name rather
# than a path on the browser surface. The overlay supplies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
    spec:
      # WITHOUT THIS, ZITADEL CANNOT START. Kubernetes injects a legacy service-link env var per
      # Service in the namespace, so the Service named `zitadel` produces
      # ZITADEL_PORT=tcp://10.x.x.x:8080 — and Zitadel's own config reader takes ZITADEL_PORT as its
      # `Port` key. It fails with "'Port' cannot parse value as 'uint16'", which names the field and
      # not the cause, AFTER its migrations have already run.
      #
      # deploy/dev/zitadel.yaml:127 carries this line for the same reason. Not carrying it over is
      # what cost an apply here.
      enableServiceLinks: false
      serviceAccountName: zitadel
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: config
          configMap:
            name: zitadel-config
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v4.16.2
          # start-from-init rather than start: it creates the database and the role its own
          # migrations need, which is why the Admin credentials below exist and are used once.
          args:
            - start-from-init
            - --config=/etc/zitadel/zitadel.yaml
            - --steps=/etc/zitadel/steps.yaml
            - --masterkeyFromEnv
            - --tlsMode=external
          env:
            # Every one of these is a reference. The masterkey in particular is a credential the
            # installer must not author (ADR-0099 decision 7) — it decrypts everything Zitadel
            # stores, so a literal here would be the worst Secret in the tree.
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-masterkey
                  key: masterkey
            # Only passwords are env overrides. Hosts, ports, database and usernames live in the
            # ConfigMap, where they are not credentials and are readable in a diff — and where the
            # server's own `Port` can be set, whose absence is what made an env-var-only attempt
            # fail with "'Port' cannot parse value as 'uint16'".
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-postgres
                  key: password
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            # The first instance's human owner. dev hardcodes ChangeMe123! in its steps file;
            # production supplies it by reference like any other credential.
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: zitadel-admin
                  key: username
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-admin
                  key: password
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /etc/zitadel
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
spec:
  type: ClusterIP
  selector:
    app: zitadel
  ports:
    - name: http
      port: 8080
      targetPort: http
