---
# Three brokers, because one cannot replicate (ADR-0099 decision 4). The bus carries CIJobFinished
# and the Notifications context's events — things no consumer can reconstruct from elsewhere — so a
# single-broker cluster is a data-loss shape wearing a queue's clothes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  replicas: 3
  serviceName: redpanda-internal
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.io/redpandadata/redpanda:v26.2.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ORD="${HOSTNAME##*-}"
              exec rpk redpanda start \
                --smp 1 --memory 1G --reserve-memory 0M --overprovisioned \
                --node-id "$ORD" \
                --kafka-addr "PLAINTEXT://0.0.0.0:9092" \
                --advertise-kafka-addr "PLAINTEXT://${HOSTNAME}.redpanda-internal:9092" \
                --rpc-addr "0.0.0.0:33145" \
                --advertise-rpc-addr "${HOSTNAME}.redpanda-internal:33145" \
                --seeds "redpanda-0.redpanda-internal:33145,redpanda-1.redpanda-internal:33145,redpanda-2.redpanda-internal:33145"
          ports:
            - name: kafka
              containerPort: 9092
            - name: rpc
              containerPort: 33145
            - name: admin
              containerPort: 9644
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: premium-rwo
        resources:
          requests:
            storage: 50Gi
---
# Headless, so each broker is addressable by a stable DNS name — which is what the seeds and the
# advertised addresses above depend on.
apiVersion: v1
kind: Service
metadata:
  name: redpanda-internal
spec:
  clusterIP: None
  # WITHOUT THIS, THE CLUSTER CANNOT BOOTSTRAP. A broker is not Ready until it has joined, and it
  # cannot join until it can resolve its seeds — so a headless Service that publishes only ready
  # addresses leaves every broker resolving nothing. Observed on the first apply:
  # "Error requesting cluster bootstrap info from {host: redpanda-1.redpanda-internal} …
  #  redpanda-1.redpanda-internal: No data", repeating forever.
  #
  # openbao-internal had this from the start, which is exactly why OpenBao formed a quorum on the
  # same apply where Redpanda could not.
  publishNotReadyAddresses: true
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
    - name: rpc
      port: 33145
    - name: admin
      port: 9644
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
