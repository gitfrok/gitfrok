# AC8: the Ingress annotation GKE's Gateway controller silently ignores.
#
# This is the defect that actually shipped on 2026-09-22. The name in the annotation is CORRECT —
# `prod-cp-gateway`, exactly what the tofu unit reserves — which is why the old gate passed it. GKE
# read none of it, auto-provisioned its own address, reported PROGRAMMED=True, and left every DNS
# record pointing at a reserved IP nothing was serving. A right-looking string on the wrong
# mechanism, which is the hardest kind of wrong to see in a diff.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gitfrok-cp
  annotations:
    networking.gke.io/addresses: prod-cp-gateway
