# AC8: a reserved-address name that deploy/gcp/modules/addresses does not reserve.
#
# spec.addresses, not the annotation — the annotation form is what GKE IGNORES, and a fixture
# written against it proves nothing about the mechanism the Gateway actually reads.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gitfrok-cp
spec:
  addresses:
    - type: NamedAddress
      value: gitfrok-gateway-typo
