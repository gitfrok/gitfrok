# Super-repo fitness gates (T-0002 AC5, invariants 22–25). Runs the composition-level checks that
# no single submodule can run alone: dependency direction across repos, toolchain floors, and that
# a clean clone bootstraps. Per-repo build/test gates live in each submodule's own CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: super-repo fitness gates
    runs-on: ubuntu-latest
    steps:
      # Submodules are pinned commits (invariant 25); recursive checkout materialises exactly the
      # pins under review, which is what the dependency-direction scan needs to see.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: submodule pins under review
        run: git submodule status

      # Fails if any repo imports another's Go packages, or a submodule drops below an ADR-0023
      # toolchain floor.
      # CHECK_IMAGE_RESOLVE (ADR-0034) makes `make verify` also assert every dev image pin resolves in
      # its registry. Shared runners hit Docker Hub's unauthenticated rate limit regularly, so a
      # refused query is reported as inconclusive rather than failing the build — only an explicit
      # "manifest unknown" is drift.
      - name: make verify
        run: make verify
        env:
          CHECK_IMAGE_RESOLVE: 1

      # Proves a clean clone can be brought up — the path every new agent and human takes first.
      - name: make bootstrap
        run: make bootstrap

      # ADR-0037: the sixteen agent surfaces are generated from governance/canonical/agent-surfaces/.
      # Governance gates its own three; the other thirteen live in submodules a standalone run does
      # not have, so the composition is the only place all of them can be checked — the same
      # boundary `make codegen-check` sits behind. Runs after bootstrap because it needs every
      # submodule checked out, and it hard-fails rather than skipping when one is not.
      - name: make surfaces-check
        run: make surfaces-check

      # The fitness scripts are the gates; nothing was gating them. T-0002 deferred this because
      # the scripts relied on word splitting (SC2086); T-0009 replaced that with NUL-delimited
      # arrays, so the lint runs clean with no suppressions to maintain.
      #
      # Pinned, for the same reason buf and OPA are: an unpinned linter is a gate whose verdict
      # depends on the day. It was unpinned until T-0005, and that cost a red run — a finding the
      # runner's preinstalled shellcheck reported and a newer local one no longer does. Whichever
      # of the two is "right" matters less than the two agreeing, because a gate a developer cannot
      # reproduce locally is one they learn to push and see.
      # Installed into a user-writable directory rather than /usr/local/bin, so the step needs no
      # sudo and shadows the runner's preinstalled copy by PATH order alone.
      - name: pin shellcheck to v0.11.0
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C "$HOME/.local/bin" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version

      - name: make lint-shell
        run: make lint-shell

      # --- T-0020 AC5: codegen freshness (ADR-0032) -----------------------------------------------
      # This is the one check that can only exist here. Each consumer's buf.gen.yaml reads
      # ../governance/contracts, which is a sibling checkout only in this composition, so no
      # standalone consumer CI run can generate anything. The toolchain below is the cost of
      # checking it honestly rather than skipping it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # setup-go caches by default, and with no path given it looks for a go.sum at the
          # repository root. A super-repo of pinned submodules has none, so every run so far logged
          # a failed restore and cached nothing — a cache that silently does nothing is worse than
          # no cache, because the log line reads like it worked. Both consumer modules are listed:
          # codegen-check and policy-check below build backend and bff, and a key derived from only
          # one of them would go stale without invalidating.
          cache-dependency-path: |
            backend/go.sum
            bff/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: webfrontend/package.json

      # buf is installed directly rather than via bufbuild/buf-setup-action, which is the one action
      # here with no node24 release to move to: its v1 line ends at v1.50.0 and every tag in it is
      # still node20, so the runtime deprecation cannot be cleared by a version bump the way the
      # three actions above cleared it. The pin is the part that matters (same argument as the
      # codegen plugins below — this gate compares generated output against itself, so the generator
      # must hold still), and a pinned download holds it without depending on an action's release
      # cadence. Same shape as the shellcheck step above, for the same reason.
      - name: pin buf to v1.72.0
        env:
          BUF_VERSION: v1.72.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64" \
            -o "$HOME/.local/bin/buf"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/buf" --version

      # Pinned so the gate compares like with like — a newer plugin emitting different-but-valid
      # output would look like drift.
      #
      # These are *generator* versions, and they are deliberately not tied to the protobuf runtime a
      # consumer's go.mod resolves. They used to be described as tracking it, and T-0005 made that
      # description false: OPA v1.19.0 pulls backend's runtime to protobuf 1.36.11 via MVS, while bff
      # stays at 1.35.2. Coupling the two would mean an unrelated dependency bump in one consumer
      # silently rewrote the generated code in all three. protobuf-go guarantees a newer runtime
      # accepts older generated code, so the generator pin is free to stay still — and it must,
      # because it is the thing this check holds constant.
      - name: codegen plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          npm ci --prefix webfrontend

      - name: make codegen-check
        run: make codegen-check

      # --- T-0005: the authorization path across repos (SPEC-0002) --------------------------------
      # The other check that can only exist here. governance authors the Rego, backend evaluates it,
      # bff asks over gRPC, and each consumer generates its own copy of the policy contract — so all
      # three are green in isolation while none can see the other two. This runs the real path and
      # asserts the verdicts, the bundle revision surviving every hop, and that no denied request
      # reached the data. Same reasoning as the codegen row above (ADR-0032's precedent).
      - name: make policy-check
        run: make policy-check
